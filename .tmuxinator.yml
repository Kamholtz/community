# /home/carl/.config/tmuxinator/talon.yml

name: talon
root: ../../

# Optional tmux socket
# socket_name: foo

# Note that the pre and post options have been deprecated and will be replaced by
# project hooks.

# Project hooks

# Runs on project start, always
on_project_start: ./user/community/tx-start.sh

# Run on project start, the first time
# on_project_first_start: command

# Run on project start, after the first time
# on_project_restart: command

# Run on project exit ( detaching from tmux session )
on_project_exit: cd ./user/community && ./tx-exit.sh

# Run on project stop
on_project_stop: cd ./user/community && ./tx-exit.sh

# Runs in each window and pane before window/pane specific commands. Useful for setting up interpreter versions.
# pre_window: rbenv shell 2.0.0-p247

# Pass command line options to tmux. Useful for specifying a different tmux.conf.
# tmux_options: -f ~/.tmux.mac.conf

# Change the command to call tmux. This can be used by derivatives/wrappers like byobu.
# tmux_command: byobu

# Specifies (by name or index) which window will be selected on project startup. If not set, the first window is used.
# startup_window: editor

# Specifies (by index) which pane of the specified window will be selected on project startup. If not set, the first pane is used.
# startup_pane: 1

# Controls whether the tmux session should be attached to automatically. Defaults to true.
# attach: false

windows:
  - talon:
      layout: main-horizontal
      # Synchronize all panes of this window, can be enabled before or after the pane commands run.
      # 'before' represents legacy functionality and will be deprecated in a future release, in favour of 'after'
      # synchronize: after
      panes:
        - xmodmap -e 'keycode 191 = F13' && xmodmap -e 'keycode 192 = F14' && xmodmap -e 'keycode 193 = F15' && xmodmap -e 'keycode 194 = F16' && xmodmap -e 'keycode 195 = F17' && xmodmap -e 'keycode 196 = F18' && xmodmap -e 'keycode 197 = F19' && xmodmap -e 'keycode 198 = F20' && xmodmap -e 'keycode 199 = F21' && xmodmap -e 'keycode 200 = F22' && xmodmap -e 'keycode 201 = F23' && xmodmap -e 'keycode 202 = F24' && ~/talon/run.sh 2>&1 | ccze -A -o nolookups
        - sleep 3 && bin/repl
        - sleep 3 && echo 'events.tail()' | bin/repl 2>&1 | ccze -A -o nolookups
  - editor:
      layout: main-vertical
      # Synchronize all panes of this window, can be enabled before or after the pane commands run.
      # 'before' represents legacy functionality and will be deprecated in a future release, in favour of 'after'
      # synchronize: after
      panes:
        - nvim -- ./user/community/my-config/user.talon
  - stt-server:
      panes:
        - cd /home/carl/repos/realtimestt-cli && bash -lc 'source venv/bin/activate && trap "exit 0" INT TERM; while true; do python -u webserver/server.py; code=$?; if [ $code -eq 0 ] || [ $code -eq 130 ]; then echo "server stopped ($code)"; break; fi; echo "server crashed ($code), restarting in 1s..."; sleep 1; done'
  - codex: codex
  - git: lazygit -p ./user/community
